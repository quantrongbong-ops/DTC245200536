# ============================================================
# Security headers dùng chung cho mọi location
#
# LƯU Ý VỀ NGINX: directive `add_header` KHÔNG được kế thừa xuống location
# nếu location đó có `add_header` của riêng nó. Vì vậy file này được
# `include` lại trong TỪNG location thay vì chỉ đặt ở server block.
# ============================================================

# Không cho trình duyệt tự đoán MIME type
add_header X-Content-Type-Options "nosniff" always;

# Chống clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Không rò rỉ URL đầy đủ (có thể chứa token) sang site khác
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Tắt các API trình duyệt không dùng đến
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# HSTS: chỉ bật khi phục vụ qua HTTPS.
# LƯU Ý: đây là chứng chỉ TỰ KÝ cho môi trường demo. HSTS khiến trình duyệt
# ghi nhớ "chỉ dùng HTTPS" cho host này. Đặt max-age ngắn (1 ngày) để tránh
# khoá cứng localhost nếu sau này bạn đổi cấu hình.
add_header Strict-Transport-Security "max-age=86400" always;

# ------------------------------------------------------------
# Content-Security-Policy
#
# Được xây dựng từ việc đọc mã nguồn frontend, KHÔNG sao chép mẫu:
#  - index.html nạp Google Fonts  -> style-src phải cho fonts.googleapis.com
#    và font-src phải cho fonts.gstatic.com
#  - InvoiceModal.jsx hiển thị ảnh VietQR -> img-src phải cho img.vietqr.io
#  - React/Recharts inject <style> và thuộc tính style -> cần 'unsafe-inline'
#    cho style-src (KHÔNG cần cho script-src)
#  - Ảnh món ăn trong seed trỏ /images/*.jpg (phục vụ từ chính domain)
#  - 'unsafe-eval' KHÔNG được cấp: script-src chỉ 'self'
# ------------------------------------------------------------
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://img.vietqr.io; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
