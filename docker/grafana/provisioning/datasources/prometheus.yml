# ============================================================
# Grafana provisioning: datasource Prometheus (Loki thêm ở Phase 7)
# ============================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # UID cố định để dashboard JSON tham chiếu được chính xác.
    # Nếu để Grafana tự sinh UID, dashboard import từ file sẽ trỏ sai datasource.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
