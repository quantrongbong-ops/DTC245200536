<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Nhà hàng An Phúc">
  <!-- Biểu trưng: đĩa ăn với dao và nĩa, tông màu cam đất của nhà hàng -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e0d5"/>
    </linearGradient>
  </defs>

  <!-- Nền tròn -->
  <circle cx="32" cy="32" r="32" fill="#c2410c"/>

  <!-- Đĩa ăn -->
  <circle cx="32" cy="32" r="20" fill="url(#plate)"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#9a3412" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#d6cbbc" stroke-width="2"/>

  <!-- Nĩa (bên trái) -->
  <g fill="#ffffff">
    <rect x="12" y="18" width="2.4" height="28" rx="1.2"/>
    <rect x="16.4" y="18" width="2.4" height="28" rx="1.2"/>
    <rect x="20.8" y="18" width="2.4" height="28" rx="1.2"/>
    <rect x="12" y="18" width="11.2" height="9" rx="2"/>
  </g>

  <!-- Dao (bên phải) -->
  <g fill="#ffffff">
    <rect x="49.6" y="18" width="2.4" height="28" rx="1.2"/>
    <path d="M45.6 18 h4 v9 c0 3 -1.8 5 -4 5 z"/>
  </g>
</svg>
