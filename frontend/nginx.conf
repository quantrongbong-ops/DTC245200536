# ============================================================
# Nginx config cho frontend static (SPA)
# ============================================================
server {
    # Lắng nghe cả IPv4 và IPv6.
    # Trong container, `localhost` phân giải thành ::1 trước; nếu chỉ có
    # `listen 8080` (IPv4) thì healthcheck gọi localhost sẽ bị Connection refused.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache tĩnh cho bundle đã băm tên (Vite sinh tên có hash nội dung).
    # Dùng ^~ để location này thắng các location regex bên dưới.
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # File tĩnh theo phần mở rộng.
    #
    # VÌ SAO CẦN: `location /` có `try_files $uri $uri/ /index.html` — nghĩa là
    # MỌI đường dẫn không tồn tại đều trả HTTP 200 kèm index.html. Với một
    # trang SPA thì đúng, nhưng với file tĩnh thì SAI: trình duyệt xin
    # /logo.svg hay /images/mon-an.jpg sẽ nhận HTML với Content-Type text/html
    # và HTTP 200, nên không thể phân biệt file thiếu với file có thật.
    # Location này buộc trả 404 thật cho các file tĩnh không tồn tại.
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|bmp|woff2?|ttf|otf|eot|txt|xml|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback: các route của ứng dụng (React Router) về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # stub_status cho nginx-prometheus-exporter (chỉ mạng nội bộ)
    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
